[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btengine"
version = "0.1.0"
description = "Leakage-free backtesting engine for 2-runner match-odds betting strategies (IPL MVP)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
btengine = "btengine.cli:main"

[tool.setuptools.packages.find]
include = ["btengine*"]
